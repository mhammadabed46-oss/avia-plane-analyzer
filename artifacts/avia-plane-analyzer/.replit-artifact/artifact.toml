kind = "mobile"
previewPath = "/"
title = "Avia Plane Screen Analyzer"
description = "An Android-first, privacy-focused tool that reads Avia Plane multipliers from a user-authorized screen capture, records completed rounds locally, and presents historical statistics without predicting outcomes or placing bets."
version = "1.0.0"
id = "artifacts/avia-plane-analyzer"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23713

[services.development]
run = "pnpm --filter @workspace/avia-plane-analyzer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/avia-plane-analyzer", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/avia-plane-analyzer", "run", "serve" ]

[services.env]
PORT = "23713"
BASE_PATH = "/"
